<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780"><defs><filter id="glow"><feGaussianBlur stdDeviation="8"/></filter></defs><rect width="100%" height="100%" rx="24" fill="#0b1120"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="45" y="50" fill="#dce5f4" font-size="27" font-weight="650">产品架构｜模型负责探索，服务端负责边界</text><text x="45" y="79" fill="#9db0cb" font-size="14" font-weight="400">目标职责图，不是全量实现证明；虚线区为规划，有限本机能力与生产能力分开验收。</text><rect x="45" y="110" width="1070" height="80" rx="14" fill="#131e30" stroke="#4a6288"/><text x="67" y="144" fill="#dce5f4" font-size="18" font-weight="600">会话工作台</text><text x="67" y="172" fill="#9db0cb" font-size="13" font-weight="400">自然语言问题 · 可选任务附件 · 模型选择 · 连续澄清 · 正文与可查证据</text><text x="490" y="222" fill="#bfff70" font-size="14" font-weight="400">↓ 请求意图 / 任务上下文</text><rect x="45" y="245" width="315" height="90" rx="14" fill="#131e30" stroke="#4a6288"/><text x="67" y="279" fill="#dce5f4" font-size="18" font-weight="600">模型服务</text><text x="67" y="307" fill="#9db0cb" font-size="13" font-weight="400">授权模型目录 / API / 用量与估算预算</text><rect x="380" y="245" width="400" height="90" rx="14" fill="#131e30" stroke="#7daaff"/><text x="402" y="279" fill="#dce5f4" font-size="18" font-weight="600">Claude Agent SDK ＋ 产品 Skills</text><text x="402" y="307" fill="#9db0cb" font-size="13" font-weight="400">能力适用性 → 按需加载 → 有界任务规划</text><rect x="800" y="245" width="315" height="90" rx="14" fill="#131e30" stroke="#4a6288"/><text x="822" y="279" fill="#dce5f4" font-size="18" font-weight="600">语义与知识</text><text x="822" y="307" fill="#9db0cb" font-size="13" font-weight="400">批准口径 / 元数据 / RAG 后续适配</text><text x="65" y="375" fill="#dce5f4" font-size="16" font-weight="400">L1 标准指标</text><text x="335" y="375" fill="#dce5f4" font-size="16" font-weight="400">L2 审核主题</text><text x="595" y="375" fill="#dce5f4" font-size="16" font-weight="400">L3 授权元数据 / SQL</text><text x="895" y="375" fill="#dce5f4" font-size="16" font-weight="400">L4 知识咨询</text><text x="45" y="403" fill="#9db0cb" font-size="13" font-weight="400">路线先判断适用性，不机械跑完四层；未接能力明确拒绝或澄清，不猜企业默认值。</text><rect x="45" y="433" width="1070" height="86" rx="14" fill="#131e30" stroke="#bfff70"/><text x="67" y="467" fill="#dce5f4" font-size="18" font-weight="600">服务端治理 Harness</text><text x="67" y="495" fill="#9db0cb" font-size="13" font-weight="400">主体与权限 · 模型/语义/来源版本 · 用户确认 · SQL 检查 · 预算 · 幂等与未知结果保护</text><text x="515" y="549" fill="#bfff70" font-size="14" font-weight="400">↓ 治理 MCP / adapters</text><rect x="45" y="567" width="515" height="80" rx="14" fill="#131e30" stroke="#4a6288"/><text x="67" y="601" fill="#dce5f4" font-size="18" font-weight="600">授权数据与真实执行</text><text x="67" y="629" fill="#9db0cb" font-size="13" font-weight="400">已有受控本地来源 / 审定 MCP；企业仓库另核授权</text><rect x="580" y="567" width="535" height="80" rx="14" fill="#131e30" stroke="#4a6288"/><text x="602" y="601" fill="#dce5f4" font-size="18" font-weight="600">自动质检与回执发布</text><text x="602" y="629" fill="#9db0cb" font-size="13" font-weight="400">真实结果 / QA / 来源与限制；数据行不默认回模型</text><rect x="45" y="674" width="1070" height="70" rx="14" fill="none" stroke="#7f95b4" stroke-dasharray="7 5"/><text x="65" y="706" fill="#dce5f4" font-size="16" font-weight="400">后续：统一临时表 · 授权 RAG · 正式资产与历史 · 图表与报告 · 分析 / 归因</text><text x="65" y="729" fill="#9db0cb" font-size="12" font-weight="400">D086 默认无预选口径 / 选源 UI 及配套服务端改造待实施；正式部署、身份与生产隔离未交付。</text></g></svg>
